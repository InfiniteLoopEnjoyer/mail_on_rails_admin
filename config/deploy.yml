<% require "dotenv"; Dotenv.load(".env") %>

# Generic template - real infrastructure (hosts, domains) lives in the
# gitignored destination overlay config/deploy.prod.yml. Deploy with
# `bin/kamal deploy -d prod`.

# Name of your application. Used to uniquely configure containers.
service: mail_on_rails

# Name of the container image (use your-user/app-name on external registries).
image: mail_on_rails

# Three roles from one image: the web UI (Puma + Solid Queue behind
# kamal-proxy) and the SMTP and IMAP servers, each in its own container
# running bin/mail_server. They share the Postgres accessory (Unix
# socket), the storage volume, the Let's Encrypt mount, and the clamav /
# rspamd accessories. The mail containers publish their ports straight
# off the host (options: publish); kamal's boot-new-first order would
# clash on those ports, so .kamal/hooks/pre-app-boot stops the OLD smtp /
# imap containers first - a short mail-only outage per deploy (SMTP
# senders retry, IMAP clients reconnect), while web rolls with zero
# downtime.
#
# One container for everything is still possible: give the web role
# MAIL_ON_RAILS_SERVERS: smtp,imap plus the publish list and drop the
# smtp/imap roles (the :mail_on_rails Puma plugin in config/puma.rb does
# the rest; WEB_CONCURRENCY must then stay 1).
servers:
  web:
    hosts:
      - 192.168.0.1
    env:
      clear:
        # Run the Solid Queue supervisor inside Puma (see config/puma.rb):
        # Action Mailbox routing, outbound delivery and the recurring jobs
        # run here, the only owner-privileged container.
        SOLID_QUEUE_IN_PUMA: true

        # No mail listeners in the web process: they run in the smtp and
        # imap roles below (the Puma plugin is then a no-op and /up does
        # not wait on mail ports). Set to smtp,imap for the all-in-one
        # container.
        MAIL_ON_RAILS_SERVERS: 0

        # Set number of processes dedicated to Solid Queue (default: 1)
        # JOB_CONCURRENCY: 3

        # Nightly pg_dump retention (DatabaseBackupJob writes onto the
        # storage volume; docs/backups.md covers restore and offsite
        # copies). Defaults shown.
        # DB_BACKUP_KEEP_DAYS: 14
        # DB_BACKUP_DIR: /rails/storage/backups

        # Backup encryption: DB_BACKUP_ENCRYPTION_KEY is wired as a Kamal
        # secret (see env.secret below and .kamal/secrets-common); dumps
        # are AES-256-GCM encrypted (.dump.enc). See docs/backups.md.

        # Prometheus: GET /metrics needs both METRICS_TOKEN (better: as a
        # secret in .kamal/secrets), presented by scrapers as a bearer
        # token, and METRICS_ALLOW_IPS (comma-separated IPs/CIDRs) pinning
        # the endpoint to your scraper's addresses - a token alone is one
        # leaked scrape config away from open, so without the allowlist
        # the endpoint stays 404. See MetricsController for the series.
        # METRICS_TOKEN: choose-a-long-random-string
        # METRICS_ALLOW_IPS: 10.0.0.0/8

        # The second-factor mandate is on by default: users without a
        # second factor are parked on 2FA enrollment until they register
        # one - a password-only admin is the whole system's weakest link.
        # Single-operator setups that accept that risk opt out explicitly.
        # MAIL_ON_RAILS_REQUIRE_2FA: 0

  # The SMTP server: MX (25), submission (587), SMTPS (465). Host port ->
  # in-container port (the daemon binds >1024 because the container runs
  # as uid 1000). No proxy: kamal-proxy only fronts HTTP.
  smtp:
    hosts:
      - 192.168.0.1
    cmd: ./bin/mail_server --protocols smtp
    options:
      publish:
        - "25:1025"
        - "587:1587"
        - "465:1465"
      # Docker-level liveness: all three listener sockets are in LISTEN
      # state (ports 1025/1587/1465 = 0401/0633/05B9 in /proc/net/tcp).
      # Deliberately NOT a TCP connect: a probe that connects is a real
      # SMTP session every 10 s - a banner, a closed-connection history
      # row, a "127.0.0.1" entry on the /smtp page. Kamal waits for this
      # to turn healthy before booting the next role; the post-deploy hook
      # does the one real connect per port per deploy.
      health-cmd: 'bash -c "[ \"$(grep -hE \"^ *[0-9]+: [0-9A-F]+:(0401|0633|05B9) [0-9A-F:]+ 0A \" /proc/net/tcp /proc/net/tcp6 | wc -l)\" -ge 3 ]"'
      health-interval: 10s
      health-timeout: 5s
      health-retries: 3
      health-start-period: 60s
    env:
      clear:
        # Each connection thread checks a connection out of the AR pool
        # for the duration of a store call; size the pool for the
        # listener's concurrency, not for Puma.
        RAILS_MAX_THREADS: 16

  # The IMAP server: IMAP (143) and IMAPS (993).
  imap:
    hosts:
      - 192.168.0.1
    cmd: ./bin/mail_server --protocols imap
    options:
      publish:
        - "143:1143"
        - "993:1993"
      # LISTEN-state check for 1143/1993 (0477/07C9), never a connect -
      # see the smtp role.
      health-cmd: 'bash -c "[ \"$(grep -hE \"^ *[0-9]+: [0-9A-F]+:(0477|07C9) [0-9A-F:]+ 0A \" /proc/net/tcp /proc/net/tcp6 | wc -l)\" -ge 2 ]"'
      health-interval: 10s
      health-timeout: 5s
      health-retries: 3
      health-start-period: 60s
    env:
      clear:
        # IMAP IDLE holds many long-lived connections; each store call
        # checks a pool connection out only for its own duration.
        RAILS_MAX_THREADS: 16

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
proxy:
  ssl: true
  # List every hosted domain's MTA-STS policy host (mta-sts.<domain>)
  # alongside the web host: the Domains UI CNAMEs them here and the app
  # serves /.well-known/mta-sts.txt, but kamal-proxy only obtains
  # certificates for hosts named below.
  hosts:
    - www.example.com
    - mta-sts.example.com

# Give the containers time to boot: the web entrypoint runs db:prepare
# before /up turns healthy.
deploy_timeout: 120

# Where you keep your container images.
#
# This is the local registry container (kamal-docker-registry) on the machine
# you deploy from. Kamal recognises a localhost registry and opens a reverse
# SSH tunnel to it for the push/pull window itself (Kamal::Cli::Build::
# PortForwarding), so "localhost:5555" resolves to it on both ends - do NOT
# add a tunnel hook of your own, it will squat on the remote port and make
# kamal's own forward fail. Docker allows plain HTTP for 127.0.0.0/8
# registries, so no TLS or auth is needed.
registry:
  server: localhost:5555

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    # Cloudflare API token (Zone:Read + DNS:Edit over the hosted zones)
    # for the Domains UI's "Publish DNS" button - see DnsPublisher. Unset
    # = the button is hidden; nothing else uses it.
    - CLOUDFLARE_API_TOKEN
    # AES-256-GCM key for the nightly DB dump (DatabaseBackupJob). Set =
    # encrypted .dump.enc on the storage volume; unset = plaintext dumps +
    # a nightly warning. Generate `openssl rand -hex 32`, keep it in the
    # gitignored .env, and ESCROW IT OFFSITE - the key lives on the deploy
    # machine, not the droplet, so losing it makes existing backups
    # unrecoverable. bin/db-backup-decrypt recovers them for pg_restore.
    - DB_BACKUP_ENCRYPTION_KEY
  clear:
    # Database (postgres accessory below, reached over its Unix socket).
    # The rest of the connection config lives in config/database.yml.
    POSTGRES_USER: mail_on_rails
    POSTGRES_DB: mail_on_rails_production

    # Web-UI/mailer host (proxy.host below and Action Mailer link
    # generation in config/environments/production.rb). Every role boots
    # the app, so every role needs it.
    MAIL_ON_RAILS_WEB_HOST: www.example.com

    # Mail configuration shared by every role: the web role runs outbound
    # delivery and the mailroom (HELO name, scanners), the smtp role the
    # listeners, the imap role APPEND rescans - so these live here rather
    # than per role. Role-specific values (ports, pool size, the job
    # supervisor) sit on the roles above.


    # EHLO/banner name for the SMTP server and outbound delivery; must
    # match this host's public mail name (and ideally the droplet's
    # PTR record).
    # To relay through a provider instead of delivering to MXes directly,
    # also set MAIL_ON_RAILS_SMARTHOST (host:port) and
    # MAIL_ON_RAILS_SMARTHOST_USER/_PASSWORD.
    SMTP_HELO_HOST: mail.example.com

    # TLS for the mail listeners: the certbot accessory (below) renews
    # into /etc/letsencrypt on the host, mounted read-only into this
    # container. Both servers re-read the PEMs on mtime change, so a
    # renewal needs no restart. With these set, unusable material is
    # fatal at boot on both protocols - explicitly configured TLS
    # never degrades to plaintext.
    #
    # Accept-side abuse caps (per-IP connection cap, connection-rate
    # tarpit, auth lockout) default on for both protocols; tune or
    # disable (0) with SMTP_MAX_CONN_PER_IP / SMTP_CONN_RATE /
    # SMTP_AUTH_LOCKOUT_FAILURES and their MAIL_ON_RAILS_IMAP_*
    # equivalents. SMTP connections additionally have an absolute
    # lifetime (SMTP_SESSION_SECONDS, default 3600) - the slowloris
    # bound; IMAP has none because IDLE is long-lived by design.
    SMTP_TLS_CERT: /etc/letsencrypt/live/mail.example.com/fullchain.pem
    SMTP_TLS_KEY: /etc/letsencrypt/live/mail.example.com/privkey.pem
    MAIL_ON_RAILS_TLS_CERT: /etc/letsencrypt/live/mail.example.com/fullchain.pem
    MAIL_ON_RAILS_TLS_KEY: /etc/letsencrypt/live/mail.example.com/privkey.pem

    # Outbound DKIM signing needs no config here: private keys live
    # encrypted in the domains table (minted by the Domains admin UI on
    # domain creation); the public halves are published as
    # <selector>._domainkey.<domain> TXT records (selector default:
    # rail, override with MAIL_ON_RAILS_DKIM_SELECTOR).

    # Permanent IP/CIDR bans (BannedIp - auth attempts page + Spamhaus
    # DROP import) need no config: every listener polls the table
    # through its store, drops matches before any banner, and kicks
    # already-open sessions on its next ops-sync tick.

    # Virus scanning: the SMTP server (smtp role) scans at DATA time
    # (rejects infected mail before acceptance, fails closed with 451
    # when clamd is down - so keep the clamav accessory healthy), and
    # the mailroom (web) + IMAP APPEND (imap) rescan (defense in depth). One
    # address drives every scan path and there is no built-in
    # default - unset (or "") turns scanning off everywhere, and the
    # mail servers refuse to boot like that in production unless
    # SMTP_CLAMAV_OPTIONAL=1 explicitly opts out.
    SMTP_CLAMAV_ADDR: mail_on_rails-clamav:3310

    # rspamd accessory (see accessories below), reached by container name
    # over the kamal docker network. Two consumers: the mailroom POSTs
    # each inbound message here to compute SPF/DKIM/DMARC (+ a spam
    # action) from the edge-stamped connection facts - rspamd is the
    # verdict authority for filing; the SMTP server's own
    # SPF/DKIM/DMARC stack is a connection-time gate - and the SMTP
    # server scores authenticated submissions at DATA, refusing
    # rspamd's "reject"/"soft reject" actions (the tripwire for a
    # compromised account pumping spam; fails open when rspamd is
    # down). Unset to disable both.
    SMTP_RSPAMD_ADDR: mail_on_rails-rspamd:11333

    # Per-account outbound quota: recipients accepted from an
    # authenticated sender per sliding window (seconds), answered with
    # a retryable 452 once exhausted. Bounds what a stolen password is
    # worth to a botnet - per-IP limits never see one credential
    # worked from many IPs. Defaults shown; SMTP_SEND_QUOTA: 0
    # disables.
    # SMTP_SEND_QUOTA: 200
    # SMTP_SEND_QUOTA_WINDOW: 3600

    # Mail-in-transit hardening: the gem defaults to the enforcing
    # posture (verified outbound TLS, MTA-STS enforce, DMARC
    # enforcement, rspamd fail-closed) - nothing to flip on. A brand
    # new deployment that still needs to soak (TLS-RPT reports not yet
    # clean, "would reject under DMARC enforcement" logs not yet
    # quiet) weakens the relevant knob explicitly and removes the
    # override when the soak is done; Settings::Check nags in
    # production until it is.
    # SMTP_OUTBOUND_REQUIRE_VERIFIED_TLS: 0
    # MAIL_ON_RAILS_MTA_STS_MODE: testing
    # SMTP_DMARC_ENFORCE: 0
    # MAILROOM_DMARC_ENFORCE: log
    # SMTP_RSPAMD_FAIL_CLOSED: 0
    # MAIL_ON_RAILS_SMARTHOST_TLS: starttls

    # Outbound DANE needs no resolver configuration: the gem
    # validates DNSSEC in-process (chain of trust walked to its
    # embedded IANA root anchor, denial proofs included), so the mail
    # DNS client can query any upstream - including Docker's embedded
    # stub from resolv.conf, untrusted. MAIL_ON_RAILS_DNS_NAMESERVERS
    # remains available to point at a different upstream if the host
    # DNS path is ever unreliable.

    # WEB_CONCURRENCY: the web role may run cluster mode now that the
    # mail listeners live in their own containers; only an all-in-one web
    # role (MAIL_ON_RAILS_SERVERS: smtp,imap) must keep it unset/1 - the
    # :mail_on_rails plugin refuses cluster mode with listeners in-process.

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# e.g. "bin/kamal logs --grep ingress".
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  smtp-logs: app logs -f --roles smtp
  imap-logs: app logs -f --roles imap
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  # On-demand pg_dump onto the storage volume (the nightly one is
  # DatabaseBackupJob in config/recurring.yml). Restore: docs/backups.md.
  backup: app exec --reuse "bin/db-backup"

# Certbot renewal daemon for the mail-port TLS cert (DNS-01 via Cloudflare,
# so it never needs port 80). Runs as the same uid as the app container, so
# every PEM it writes under /etc/letsencrypt is readable by the app without
# permission hooks. First issuance is a one-off `certonly` run (see
# /etc/letsencrypt/cloudflare.ini on the host for the API token, mode 600).
accessories:
  # PostgreSQL for the production databases (primary/cache/queue/cable -
  # bin/rails db:prepare in the entrypoint creates all four on first boot,
  # since POSTGRES_USER is the image's superuser). The app talks to it over
  # the Unix socket shared through the host directory below, so Postgres
  # never listens on the network.
  db:
    image: postgres:16
    host: 192.168.0.1
    env:
      clear:
        POSTGRES_USER: mail_on_rails
        POSTGRES_DB: mail_on_rails_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
      - socket/:/var/run/postgresql

  # ClamAV daemon scanning inbound mail. Two readers, both in the app
  # container: the SMTP server scans at DATA time (rejects infected mail
  # before acceptance, fails closed with 451 when clamd is down - so keep
  # this accessory healthy) and the mailroom + IMAP APPEND rescan
  # (defense in depth). Reached on TCP 3310 over the shared "kamal"
  # docker network by container name
  # (mail_on_rails-clamav) - no host port is published. First boot
  # downloads ~300MB of signatures and takes minutes to turn healthy (the
  # image ships its own HEALTHCHECK and internal freshclam updater); the
  # volume below persists the database across restarts. clamd holds
  # signatures in RAM (~1.5GB, briefly doubling during reloads): the host
  # needs >=4GB total. If memory gets tight, mount a clamd.conf with
  # "ConcurrentDatabaseReload no".
  clamav:
    image: clamav/clamav:1.4
    host: 192.168.0.1
    directories:
      - clamav-db:/var/lib/clamav

  # rspamd computing SPF/DKIM/DMARC (and a spam score) for inbound mail.
  # The app POSTs each message to the normal worker on TCP 11333 over the
  # shared "kamal" docker network by container name (mail_on_rails-rspamd) -
  # no host port is published. rspamd needs outbound DNS to do the SPF/DKIM/
  # DMARC lookups the app never could (it never saw the live connection).
  # SPF/DKIM/DMARC run out of the box with no config; Redis is only needed
  # for the stateful modules (greylisting, ratelimit, fuzzy). Pin the tag to
  # a current release. The volume persists learned data across restarts.
  rspamd:
    image: rspamd/rspamd:3.9
    host: 192.168.0.1
    directories:
      - rspamd-data:/var/lib/rspamd

  # (Outbound DANE has no resolver accessory: DNSSEC validation is
  # in-process in the mail_on_rails gem. The app container only needs
  # ordinary DNS through Docker's embedded stub.)

  certbot:
    image: certbot/dns-cloudflare
    host: 192.168.0.1
    options:
      user: "1000:1000"
      entrypoint: /bin/sh
    cmd: -c "while true; do certbot renew --quiet; sleep 12h; done"
    volumes:
      - "/etc/letsencrypt:/etc/letsencrypt"
      - "/var/lib/letsencrypt:/var/lib/letsencrypt"
      - "/var/log/letsencrypt:/var/log/letsencrypt"

# Use a persistent storage volume for local Active Storage files (inbound
# mail blobs land there via Action Mailbox) and DKIM keys. The postgres socket dir is the accessory's
# "socket/" directory on the host (kamal puts accessory dirs under
# /root/<service>-<accessory>/).
volumes:
  - "mail_on_rails_storage:/rails/storage"
  - "/root/mail_on_rails-db/socket:/postgres/socket"
  # The mail listeners' TLS certs, renewed by the certbot accessory into
  # this host path (its deploy-hook chmods privkey to 0644 so uid 1000
  # can read it).
  - "/etc/letsencrypt:/etc/letsencrypt:ro"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64
