# Bayes classifier on the rspamd-data volume - SQLite backend, no Redis.
# Mounted by Kamal at /etc/rspamd/local.d/classifier-bayes.conf (see the
# rspamd accessory in deploy.yml); merged into the stock classifier "bayes"
# block, whose tokenizer/learn_condition defaults stay.
#
# Trained only by the users' own Junk moves (the app POSTs /learnspam and
# /learnham on the controller - MailOnRails::LearnSpamJob); no autolearn,
# so a confidently wrong score never reinforces itself. The SQLite
# backend needs an explicit path per statfile; the learn cache follows
# the backend type (${DBDIR}/learn_cache.sqlite), and that cache is what
# makes a relearn as the other class unlearn the first one.
backend = "sqlite3";

# Personal server: start classifying once 20 spam and 20 ham have been
# learned (the stock 200 would keep Bayes silent for months).
min_learns = 20;

statfile {
  symbol = "BAYES_HAM";
  spam = false;
  path = "${DBDIR}/bayes.ham.sqlite";
}
statfile {
  symbol = "BAYES_SPAM";
  spam = true;
  path = "${DBDIR}/bayes.spam.sqlite";
}
