name: Security

on:
  pull_request:
  push:
    branches: [ main ]
  # Advisories land between pushes; a daily re-scan catches new CVEs in
  # the bundle, the JS deps, and the container image even when the repo
  # is quiet.
  schedule:
    - cron: "17 5 * * *"

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      # bin/importmap boots the full app (config/application + Bundler.require),
      # and ruby-vips raises at load time without the native library - same
      # reason the test jobs install it.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  scan_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build -t mail_on_rails:ci .

      # bundler-audit sees the gems; this sees the OS layer (ruby:slim's
      # Debian packages). ignore-unfixed skips CVEs Debian has no patch
      # for yet - failing on those would just leave CI permanently red.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mail_on_rails:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
